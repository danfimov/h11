[project]
site_url = "https://danfimov.github.io/h11/"
site_name = "h11-mypyc"
docs_dir = "docs/src"
site_description = "A pure-Python, bring-your-own-I/O implementation of HTTP/1.1"
site_author = "Nathaniel J. Smith"

copyright = "Copyright &copy; 2016 Nathaniel J. Smith"

repo_url = "https://github.com/danfimov/h11"
repo_name = "danfimov/h11"
edit_uri = "edit/master/docs/src/"

nav = [
  { "Introduction" = "index.md" },
  { "Getting started" = "basic-usage.md" },
  { "API documentation" = "api.md" },
  { "Examples" = "examples.md" },
  { "Details of our HTTP support" = "supported-http.md" },
  { "History of changes" = "changes.md" },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/danfimov/h11"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/h11-mypyc/"

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["."]
options.docstring_style = "google"
options.show_source = false
options.show_root_heading = true
options.show_root_full_path = false
options.heading_level = 3
options.members_order = "source"
options.separate_signature = true
options.show_signature_annotations = true
options.signature_crossrefs = true

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets.base_path = ["docs/includes", "examples"]
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
